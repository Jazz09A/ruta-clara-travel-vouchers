name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release-please
    runs-on: ubuntu-latest
    steps:
      # Crea/actualiza el PR de release con el CHANGELOG y el bump de
      # versión; al mergearlo publica el tag y el GitHub Release.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
