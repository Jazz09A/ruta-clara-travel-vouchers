name: Deploy producción

# Fase 5 — CD: al mergear a main se buildea el SSR (node-server), se rsync-ea
# al server y se reinicia el servicio systemd (admin.escapatetour.app).
# Requiere el secret DEPLOY_SSH_KEY (clave privada de alvaro@62.171.175.92).
# El server necesita el sudoers de infra/sudoers/escapatetour (Fase 4).

on:
  push:
    branches: [main]

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy al server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # NITRO_PRESET=node-server → bundle autocontenido en .output/ (solo
      # necesita node en el server). VITE_API_URL se inyecta en build time.
      - name: Build SSR
        run: pnpm build
        env:
          NITRO_PRESET: node-server
          VITE_API_URL: https://api.escapatetour.app/api/v1

      - name: Clave SSH del deploy
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 62.171.175.92 >> ~/.ssh/known_hosts

      - name: Rsync del build al server
        run: >-
          rsync -az --delete
          -e "ssh -p 2222 -i ~/.ssh/deploy_key"
          .output/
          alvaro@62.171.175.92:/opt/escapatetour/frontend/

      - name: Reiniciar servicio
        run: >-
          ssh -p 2222 -i ~/.ssh/deploy_key alvaro@62.171.175.92
          "sudo systemctl restart escapatetour-frontend"

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -sf https://admin.escapatetour.app/ > /dev/null; then
              echo "✅ admin.escapatetour.app responde"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Smoke test falló"
          exit 1
