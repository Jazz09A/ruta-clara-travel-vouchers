name: CD — Frontend Producción

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Desplegar frontend a producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Copiar build al servidor por rsync
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 62.171.175.92 >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete .output/ alvaro@62.171.175.92:/home/alvaro/frontend-dist/

      - name: Reiniciar servicio frontend y healthcheck
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 62.171.175.92 >> ~/.ssh/known_hosts 2>/dev/null
          ssh alvaro@62.171.175.92 \
            'systemctl --user restart frontend-service; sleep 3; curl -sf https://admin.escapatetour.app/ > /dev/null && echo "FRONTEND_OK" || echo "FRONTEND_FAILED"'
